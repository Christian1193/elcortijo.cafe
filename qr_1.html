<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR Carta — Cortijo</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #faf8f4;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem;
      gap: 2rem;
    }

    .qr-card {
      background: white;
      border: 1px solid #e0dbd2;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 320px; width: 100%;
      text-align: center;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
    }

    /* Logo */
    .logo-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 0.4rem; }
    .logo-text  { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 600; letter-spacing: 0.15em; color: #1c1a17; }
    .logo-sub   { font-size: 0.7rem; color: #6b6560; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 1.5rem; }

    /* QR container */
    .qr-wrap {
      position: relative;
      display: inline-block;
      margin: 0 auto 1.5rem;
    }
    #qr-canvas {
      display: block;
      border-radius: 8px;
    }
    /* Logo overlay in center of QR */
    .qr-logo {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 52px; height: 52px;
      background: white;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 3px white;
    }

    .qr-url  { font-size: 0.72rem; color: #6b6560; letter-spacing: 0.04em; margin-bottom: 1rem; word-break: break-all; }
    .qr-cta  { font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; font-weight: 400; color: #1c1a17; font-style: italic; margin-bottom: 0.3rem; }
    .qr-sub2 { font-size: 0.7rem; color: #6b6560; }

    /* Divider */
    .divider { width: 40px; height: 1px; background: #e0dbd2; margin: 1rem auto; }

    .address { font-size: 0.75rem; color: #6b6560; line-height: 1.6; }
    .address strong { color: #1c1a17; display: block; font-size: 0.8rem; margin-bottom: 0.2rem; }

    /* Print button */
    .print-btn {
      background: #b8341b; color: white;
      border: none; border-radius: 8px;
      padding: 0.75rem 2rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase;
      cursor: pointer; transition: background 0.2s;
    }
    .print-btn:hover { background: #d4452a; }

    .hint { font-size: 0.72rem; color: #6b6560; margin-top: 0.5rem; }

    @media print {
      body { background: white; padding: 0; justify-content: flex-start; padding-top: 1cm; }
      .print-btn, .hint { display: none; }
      .qr-card { box-shadow: none; border: 1px solid #ccc; }
    }
  </style>
</head>
<body>

  <div class="qr-card" id="printArea">
    <!-- Logo -->
    <div class="logo-wrap">
      <svg width="30" height="30" viewBox="0 0 60 60" fill="none">
        <rect x="15" y="5" width="30" height="30" rx="2" transform="rotate(45 30 20)" fill="#b8341b"/>
        <rect x="20" y="10" width="20" height="20" rx="2" transform="rotate(45 30 20)" fill="white"/>
        <rect x="25" y="15" width="10" height="10" rx="1" transform="rotate(45 30 20)" fill="#b8341b"/>
      </svg>
      <span class="logo-text">CORTIJO</span>
    </div>
    <p class="logo-sub">Cafeterías &amp; Cervezerías</p>

    <!-- QR -->
    <div class="qr-wrap">
      <canvas id="qr-canvas"></canvas>
      <div class="qr-logo">
        <svg width="36" height="36" viewBox="0 0 60 60" fill="none">
          <rect x="12" y="3" width="36" height="36" rx="2" transform="rotate(45 30 21)" fill="#b8341b" opacity="0.15"/>
          <rect x="18" y="9" width="24" height="24" rx="2" transform="rotate(45 30 21)" fill="#b8341b" opacity="0.3"/>
          <rect x="24" y="15" width="12" height="12" rx="1" transform="rotate(45 30 21)" fill="#b8341b"/>
        </svg>
      </div>
    </div>

    <p class="qr-url">elcortijo-cafe.vercel.app/carta.html</p>
    <p class="qr-cta">Escanea para ver la carta</p>
    <p class="qr-sub2">o visítanos en:</p>

    <div class="divider"></div>

    <div class="address">
      <strong>Cortijo — Gijón</strong>
      C/ Dos de mayo 26, bajo 3<br>
      Tel. 985 021 342
    </div>
  </div>

  <button class="print-btn" onclick="window.print()">🖨 Imprimir / Guardar PDF</button>
  <p class="hint">Usa "Guardar como PDF" en las opciones de impresión para obtener un archivo listo para imprimir</p>

  <!-- QR Generator (sin dependencias externas) -->
  <script>
  // Minimal QR code generator (MIT) — adaptado para uso inline
  // Genera el QR directamente en canvas sin librerías externas
  const QR_URL = 'https://www.cafeteriaelcortijo.com/carta.html';

  // Usamos la API de Google Charts como fallback rápido y fiable
  (function() {
    var canvas  = document.getElementById('qr-canvas');
    var size    = 220;
    canvas.width  = size;
    canvas.height = size;
    var ctx = canvas.getContext('2d');

    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      ctx.drawImage(img, 0, 0, size, size);
    };
    img.onerror = function() {
      // Fallback: mostrar URL si no carga la imagen
      ctx.fillStyle = '#1c1a17';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('QR no disponible offline', size/2, size/2);
      ctx.fillText('Necesita conexión a internet', size/2, size/2 + 20);
    };
    // Google Charts QR API — gratis, sin clave
    img.src = 'https://chart.googleapis.com/chart?cht=qr&chs=' + size + 'x' + size +
              '&chl=' + encodeURIComponent(QR_URL) +
              '&choe=UTF-8&chld=H|1';
  })();
  </script>

</body>
</html>
